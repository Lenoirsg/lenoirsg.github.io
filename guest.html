<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Poppins:wght@300;400;500;600&amp;display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><title>Le Noir</title><style>  :root{--noir:#0E0E0F;--panel:#161417;--line:#2a2620;--gold:#C9A24B;--gold-soft:#f2dca8;--cream:#EDE6D8;--muted:#9a938a;--err:#e0715f;}

  .flash{animation:pulse 1.4s ease-in-out infinite;}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,75,.5)}50%{box-shadow:0 0 0 6px rgba(201,162,75,0)}}
  .logo{width:100%;max-width:280px;display:block;margin:0 auto 22px;height:auto;}

function tlv(t,v){return t+String(v.length).padStart(2,'0')+v;}
function crc16(s){let c=0xFFFF;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++){c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}

function paynowPayload(raw,name){name=(name||'BAND').toUpperCase().slice(0,25);var v=(raw||'').replace(/\s/g,'');var t,p;
  if(!v){return '';} if(isUEN(v)){t='2';p=v.toUpperCase();}else{t='0';if(!v.startsWith('+'))v='+65'+v.replace(/^0+/,'');p=v;}

function drawQRTo(cid,raw,name){var cv=document.getElementById(cid);if(!cv)return;var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  var pl=paynowPayload(raw,name);if(!pl)return;try{var qr=qrcode(0,'M');qr.addData(pl);qr.make();var n=qr.getModuleCount(),m=8,cell=(cv.width-2*m)/n;ctx.fillStyle='#0E0E0F';for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(Math.round(m+c*cell),Math.round(m+r*cell),Math.ceil(cell),Math.ceil(cell));}catch(e){}}

function toMin(h){var p=(h||"0:0").split(':');return (+p[0])*60+(+p[1]);}

var DECK={"For a Laugh": ["What song do you pretend you hate but secretly know every word to?", "What's the most embarrassing song in your liked playlist right now?", "If your life had a laugh track, what song would replace it?", "What song instantly makes you drive faster?", "What's a lyric you sang wrong for years before learning the truth?"], "Makes You Think": ["What song would you want played at the most important moment of your life?", "Is there a song you can't listen to anymore because of who it reminds you of?", "What song feels like home to you?", "If you could keep only five songs forever, what's the first you'd lock in?", "What song changed how you saw the world?"], "Tell Us": ["What was the first album or song you bought with your own money?", "What song was playing during a moment you'll never forget?", "What's a song that belongs to your family?", "Who introduced you to your favourite music?", "What song reminds you of your first crush?"], "What If": ["If you could duet with anyone, living or dead \u2014 who, and what song?", "Stranded on an island with one album \u2014 which?", "If you could un-hear one song to experience it fresh, which?", "What song would you want as your ringtone if everyone could hear it?", "If you could master one instrument overnight, which?"], "After Midnight": ["What song do you hope is the last thing you ever hear?", "Is there a song that healed something in you?", "What music do you want your children \u2014 real or imagined \u2014 to know?", "What song makes you forgive someone, at least for three minutes?", "What's a song that feels like a promise you made to yourself?"], "Name the Band": [{"q": "Name the four Beatles.", "a": "John Lennon, Paul McCartney, George Harrison & Ringo Starr"}, {"q": "Name the four members of ABBA.", "a": "Agnetha, Bj\u00f6rn, Benny & Anni-Frid"}, {"q": "Name the four members of Queen.", "a": "Freddie Mercury, Brian May, Roger Taylor & John Deacon"}, {"q": "Name the three Bee Gees.", "a": "Barry var ACTS=[],CUR=null,LINEUP=[],OVERRIDE=null,view='hub';
var gameMode='card',gameCard=null,gameReveal=false,gReason={type:'',celeb:''},tipAmt=10;
async function load(){

  var l=await sb.from('lineup').select('*').eq('night',todayISO());LINEUP=l.data||[];

function actById(id){return ACTS.find(x=>x.id===id);}
function computeCur(){if(OVERRIDE&&actById(OVERRIDE))return actById(OVERRIDE);var l=LINEUP.slice().sort((a,b)=>toMin(a.start_time)-toMin(b.start_time));if(!l.length)return null;var nm=nowMin(),cur=l[0];l.forEach(s=>{if(toMin(s.start_time)<=nm)cur=s;});return actById(cur.act_id)||null;}

   +'<div class="rule"></div><input id="tName" placeholder="Your name (so they can thank you)"><button class="btn" onclick="declareTip()">I\u2019ve sent my tip \u2665</button></div>'
   +'<div class="note">Tips go direct to the band\u2019s PayNow. \u201cI\u2019ve sent my tip\u201d posts a thank-you so they can shout you out.</div></div>';}
function pickTip(v){tipAmt=v;var w=document.getElementById('customWrap');if(w)w.style.display=(v==='custom')?'block':'none';document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('on'));var f=[...document.querySelectorAll('#chips .chip')].find(c=>c.textContent==='S$'+v||(v==='custom'&&c.textContent==='Custom'));if(f)f.classList.add('on');}
function request(){var a=CUR;if(!a)return hub();var pl=playlistOf(a);
  var songs=pl.map(s=>{var p=s.split(' \u2014 ');return '<div class="song"><div><div class="n">'+esc(p[0])+'</div><div class="a">'+esc(p[1]||'')+'</div></div><button class="req" onclick="addReq(this.getAttribute(\''+'data-s\'))" data-s="'+esc(p[0])+'">Request</button></div>';}).join('')||'<div class="muted">Suggest any song below.</div>';
  return '<div class="wrap"><button class="back" onclick="go(\''+'info\')">\u2039 '+esc(a.name)+'</button><div class="eyb">Now on Stage</div><h1>'+esc(a.name)+'</h1>'
   +'<div class="card"><h2>Your details</h2><div class="muted" style="margin-bottom:4px">So the band can give you a shout-out.</div>'
   +'<div style="display:flex;gap:8px"><input id="reqName" placeholder="Your name"><input id="reqTable" placeholder="Table" style="max-width:104px"></div>'
   +'<label>Reason for the request</label><div class="seg" id="segReason"><button type="button" data-r="Dedication" onclick="setReason(\''+'Dedication\')">Dedication</button><button type="button" data-r="Celebration" onclick="setReason(\''+'Celebration\')">Celebration</button><button type="button" data-r="Other" onclick="setReason(\''+'Other\')">Other</button></div>'
   +'<div id="r_ded" style="display:none"><label>Dedicate to</label><input id="dedTo" placeholder="Who\u2019s it for?"></div>'
   +'<div id="r_celeb" style="display:none"><label>Celebrating</label><div class="chips" id="celebChips">'+['Birthday','Anniversary','Newly wed','Newly engaged','Other'].map(c=>'<div class="chip" onclick="setCeleb(this.textContent)">'+c+'</div>').join('')+'</div><div id="celebOtherWrap" style="display:none"><input id="celebOther" placeholder="Tell us the occasion"></div></div>'
   +'<div id="r_other" style="display:none"><label>Tell us more</label><input id="otherText" placeholder="Anything the band should know"></div></div>'
   +'<div class="card"><h2>Request a song</h2><input id="freeSong" placeholder="Song title"><input id="freeArtist" placeholder="Artist"><button class="btn" onclick="addFree()">Send request</button></div>'+'<div style="text-align:center;margin-top:14px"><a onclick="go(\'info\')" style="color:var(--gold);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Want to tip the band? \u2665</a></div>'+'</div>';}
function setReason(t){gReason.type=t;document.querySelectorAll('#segReason button').forEach(b=>b.classList.toggle('on',b.dataset.r===t));document.getElementById('r_ded').style.display=(t==='Dedication')?'block':'none';document.getElementById('r_celeb').style.display=(t==='Celebration')?'block':'none';document.getElementById('r_other').style.display=(t==='Other')?'block':'none';}
function setCeleb(v){gReason.celeb=v;document.querySelectorAll('#celebChips .chip').forEach(c=>c.classList.toggle('on',c.textContent===v));document.getElementById('celebOtherWrap').style.display=(v==='Other')?'block':'none';}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function buildReason(){if(gReason.type==='Dedication'){var to=val('dedTo');return to?{type:'Dedication',detail:'to '+to}:null;}if(gReason.type==='Celebration'){var c=gReason.celeb;if(!c)return null;if(c==='Other')c=val('celebOther')||'Celebration';return {type:'Celebration',detail:c};}if(gReason.type==='Other'){return {type:'Other',detail:val('otherText')};}return null;}
function collectDetails(){var name=val('reqName'),table=val('reqTable');if(!name||!table){alert('Please add your name and table first.');window.scrollTo(0,0);return null;}if(!gReason.type){alert('Please choose a reason.');return null;}var r=buildReason();if(gReason.type==='Dedication'&&!r){alert('Who is the dedication to?');return null;}if(gReason.type==='Celebration'&&!r){alert('Which celebration?');return null;}return {name:name,table:table,reason:r};}
async function sendReq(song){var d=collectDetails();if(!d)return false;var res=await sb.from('requests').insert({act_id:CUR.id,song:song,guest_name:d.name,guest_table:d.table,reason_type:(d.reason&&d.reason.type)||'',reason_detail:(d.reason&&d.reason.detail)||''});if(res.error){alert('Could not send \u2014 try again.');return false;}toast('Request sent \u266a');return true;}
async function addReq(song){await sendReq(song);}
async function addFree(){var t=val('freeSong');if(!t){alert('Enter a song title');return;}var ar=val('freeArtist');var s=ar?(t+' \u2014 '+ar):t;if(await sendReq(s)){var f=document.getElementById('freeSong');if(f)f.value='';var g=document.getElementById('freeArtist');if(g)g.value='';}}
async function declareTip(){var amt=(tipAmt==='custom')?(val('customAmt')||'?'):tipAmt;await sb.from('tips').insert({act_id:CUR.id,amount:String(amt),guest_name:val('tName')||'Guest',song:''});toast('Thank you! The band can see it \u2665');}
function drawCard(cat){var arr=DECK[cat];var c=arr[Math.floor(Math.random()*arr.length)];gameCard=(typeof c==='string')?{cat:cat,q:c}:{cat:cat,q:c.q,a:c.a};gameReveal=false;gameMode='card';render();}
function starterCard(){var cats=FAMILIES['Talk'];drawCard(cats[Math.floor(Math.random()*cats.length)]);}
function openGame(){view='game';starterCard();window.scrollTo(0,0);}
function playMore(){gameMode='choose';render();}
function revealAns(){gameReveal=true;render();}
function recCard(card){return '<div class="rec2"><div class="vinyl2"></div><div class="glabel"><div class="gcat">'+esc(card.cat)+'</div><div class="gq">'+esc(card.q)+'</div>'+(card.a&&gameReveal?'<div class="gans">'+esc(card.a)+'</div>':'')+'</div></div>';}
function gameView(){if(gameMode==='choose'){var fam=Object.keys(FAMILIES).map(fk=>'<div class="famblk"><div class="famh">'+fk+'</div><div class="catgrid">'+FAMILIES[fk].map(c=>'<button class="catbtn" onclick="drawCard(this.textContent)">'+c+'</button>').join('')+'</div></div>').join('');return '<div class="wrap"><button class="back" onclick="go(\''+'hub\')">\u2039 Back</button><div class="eyb">The Le Noir Deck</div><h1>Pick a category</h1><div class="sub">Choose your next card</div>'+fam+'</div>';}
  var c=gameCard,hasA=!!c.a;return '<div class="wrap" style="text-align:center"><button class="back" onclick="go(\''+'hub\')" style="text-align:left;display:block">\u2039 Back</button><div class="eyb">The Le Noir Deck</div>'+recCard(c)+(hasA&&!gameReveal?'<button class="btn ghost" style="max-width:240px;margin:8px auto" onclick="revealAns()">Reveal answer</button>':'')+'<div class="muted" style="margin:14px 0 6px">Answered it? Keep the night going.</div><button class="btn" style="max-width:300px;margin:0 auto" onclick="playMore()">Play more \u25b8</button><button class="btn ghost" style="max-width:300px;margin:8px auto 0" onclick="go(\''+'hub\')">Back to hub</button></div>';}
load();
</script></body></html>
